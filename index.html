<!DOCTYPE html>
<html lang="en">
    <head>
        <!--metadata and stylesheets and stuff like that-->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-ratio, intital-scale=1.0">
        <title>nitetype</title>
        
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Google+Sans+Code">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
        <link rel="icon" type="image/svg+xml" href="nitetypeicon.svg">
        <script src="script.js" defer></script>
    </head>
    <body>

        <a href="index.html"><h1><span class="fa fa-keyboard"></span> nitetype</h1></a>
        <!--i want to make it very clear, i know this slogan kinda sounds ai but i promise i
        thought of it myself. i was trying to like reference the lyrics 'dance the night away' from 
        the song 'On the Floor' by Jennifer Lopez but ik ai kinda writes like this. i also want to
        make it clear that i only used ai for what has been declared in my readme-->
        <h6>type the night away</h6>

        <!--nav bar-->
        <nav id="nav">
            <a href="index.html">type</a>
            <a href="stats.html">stats</a>
        </nav>

        <main>
            <section id="test-settings">
                <p>duration</p>
               <div>
                <button id="time-15">15</button>
                <button id="time-30">30</button>
                <button id="time-60">60</button>
                <button id="time-120">120</button>
               </div> 
            </section>

            <section id="typing-test">
               <div id="test-info">
                <span id="timer">30</span>
               </div>

               <div id="actual-typing-area">
                <div id="words">
                    <!--words will be randomly generated through javascript-->
                </div>
               </div>

               <div id="restart">
                <button id="restart-btn" type="button"><span class="fa fa-redo"></span> Restart</button>
               </div>
               
            </section>

            <section id="results">
                <div>
                    <span>WPM</span>
                    <p id="wpm">0</p>
                </div>

                <div>
                    <span>Accuracy</span>
                    <p id="accuracy">100%</p>
                </div>
            </section>

        </main>

        <footer>
        <p>copyright © nitetype 2026</p>
        </footer>

    </body>

</html>
